{% extends "base.html" %}

{% block content %}

<header>

<h1>✏️ Edit Payment</h1>

</header>

<main>

<section class="card">

<form action="/payments/edit/{{ payment.id }}" method="post">

<label>Name</label>

<input type="text"
       name="name"
       value="{{ payment.name }}"
       required>

<label>Amount</label>

<input type="number"
       step="0.01"
       name="amount"
       value="{{ payment.amount }}"
       required>

<label>Paid by</label>

<select name="person_id">

{% for person in people %}

<option value="{{ person.id }}"
{% if payment.person_id == person.id %}selected{% endif %}>

{{ person.name }}

</option>

{% endfor %}

</select>

<label>Category</label>

<select name="category_id">

{% for category in categories %}

<option value="{{ category.id }}"
{% if payment.category_id == category.id %}selected{% endif %}>

{{ category.name }}

</option>

{% endfor %}

</select>

<label>Due date</label>

<input type="date"
       name="due_date"
       value="{{ payment.due_date }}"
       required>

<label>Notes</label>

<input type="text"
       name="notes"
       value="{{ payment.notes or '' }}">

<button type="submit">Save Changes</button>

</form>

</section>

</main>

{% endblock %}
