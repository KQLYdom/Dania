{% extends "base.html" %}

{% block content %}

<header>

    <h1>✏️ Edit Income</h1>

</header>

<main>

<section class="card">

<form action="/income/edit/{{ income.id }}" method="post">

<label>Name</label>
<input type="text" name="name" value="{{ income.name }}" required>

<label>Amount</label>
<input type="number" step="0.01"
       name="amount"
       value="{{ income.amount }}"
       required>

<label>Received by</label>

<select name="person_id">

{% for person in people %}

<option value="{{ person.id }}"
{% if income.person_id == person.id %}selected{% endif %}>

{{ person.name }}

</option>

{% endfor %}

</select>

<label>Date</label>

<input type="date"
       name="income_date"
       value="{{ income.date }}"
       required>

<label>Notes</label>

<input type="text"
       name="notes"
       value="{{ income.notes or '' }}">

<button type="submit">Save Changes</button>

</form>

</section>

</main>

{% endblock %}
