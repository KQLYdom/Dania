<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
<main style="max-width:700px;margin:40px auto;">

<div class="card">

<h1>Edit Expense</h1>

<form action="/expenses/edit/{{ expense.id }}" method="post">

    <label>Name</label>
    <input type="text" name="name"
           value="{{ expense.name }}" required>

    <label>Amount</label>
    <input type="number" step="0.01"
           name="amount"
           value="{{ expense.amount }}" required>

    <label>Paid by</label>
    <select name="person_id">
        {% for person in people %}
        <option value="{{ person.id }}"
        {% if person.id==expense.person_id %}selected{% endif %}>
            {{ person.name }}
        </option>
        {% endfor %}
    </select>

    <label>Category</label>
    <select name="category_id">
        {% for category in categories %}
        <option value="{{ category.id }}"
        {% if category.id==expense.category_id %}selected{% endif %}>
            {{ category.name }}
        </option>
        {% endfor %}
    </select>

    <label>Date</label>
    <input type="date"
           name="expense_date"
           value="{{ expense.date }}">

    <label>Notes</label>
    <input type="text"
           name="notes"
           value="{{ expense.notes or '' }}">

    <div style="display:flex;gap:12px;margin-top:20px;">
        <button type="submit">Save Changes</button>

        <a href="/"
           style="padding:12px 18px;background:#e5e7eb;
                  border-radius:12px;text-decoration:none;color:#111827;">
            Cancel
        </a>
    </div>

</form>

</div>

</main>
</html>
