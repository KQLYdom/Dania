<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Manager</title>

    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<!-- Mobil hamburger -->
<button class="menu-toggle" id="menuToggle">☰</button>

<!-- Háttér sötétítés -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="layout">

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-top">
            <h2>🏠 Home Manager</h2>
            <button class="close-sidebar" id="closeSidebar">✕</button>
        </div>

        <nav>
            {% set path = request.url.path %}
            <a href="/" class="{% if path == '/' %}active{% endif %}">🏠 Dashboard</a>
            <a href="/money" class="{% if path.startswith('/money') %}active{% endif %}">💰 Money</a>
            <a href="/utilities" class="{% if path.startswith('/utilities') %}active{% endif %}">⚡ Utilities</a>
            <a href="/shopping" class="{% if path.startswith('/shopping') %}active{% endif %}">🛒 Shopping</a>
            <a href="/payments" class="{% if path.startswith('/payments') %}active{% endif %}">📅 Upcoming Payments</a>
            <a href="/todo" class="{% if path.startswith('/todo') %}active{% endif %}">✅ To-do</a>
            <a href="/settings" class="{% if path.startswith('/settings') %}active{% endif %}">⚙️ Settings</a>
            <a href="/logout">🚪 Logout</a>
        </nav>

    </aside>

    <div class="page">
        {% block content %}{% endblock %}
    </div>

</div>

<!-- Vissza fel gomb -->
<button id="backToTop" class="back-to-top">
    ⬆ Top
</button>

<script>
document.querySelectorAll(".progress-fill").forEach(bar=>{
    bar.style.width=(bar.dataset.percent||0)+"%";
});

// Hamburger
const sidebar=document.getElementById("sidebar");
const overlay=document.getElementById("sidebarOverlay");
const openBtn=document.getElementById("menuToggle");
const closeBtn=document.getElementById("closeSidebar");

function closeMenu(){
    sidebar.classList.remove("open");
    overlay.classList.remove("show");
}

openBtn?.addEventListener("click",()=>{
    sidebar.classList.add("open");
    overlay.classList.add("show");
});

closeBtn?.addEventListener("click",closeMenu);
overlay?.addEventListener("click",closeMenu);

// Automatikus bezárás linkre
document.querySelectorAll(".sidebar nav a").forEach(a=>{
    a.addEventListener("click",closeMenu);
});

// Back to top
const backBtn=document.getElementById("backToTop");

window.addEventListener("scroll",()=>{
    if(window.scrollY>400){
        backBtn.classList.add("show");
    }else{
        backBtn.classList.remove("show");
    }
});

backBtn.addEventListener("click",()=>{
    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
});
</script>

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
}
</script>

</body>
</html>
